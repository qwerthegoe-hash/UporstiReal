name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Распаковка исходников проекта
        run: |
          unzip -o teams_autojoiner_ready_for_github.zip -d . -x '.github/*'
          sed -i 's/kivy==2.2.1/kivy==2.3.0/' buildozer.spec
          python - <<'PY'
          from pathlib import Path
          spec = Path("buildozer.spec")
          lines = spec.read_text().splitlines()
          for index, line in enumerate(lines):
              if line.strip().startswith("requirements"):
                  key, value = line.split("=", 1)
                  items = [item.strip() for item in value.split(",") if item.strip()]
                  if "liblzma" not in items:
                      items.append("liblzma")
                  lines[index] = f"{key.rstrip()} = {','.join(items)}"
                  break
          else:
              raise SystemExit("Не найден параметр requirements в buildozer.spec")
          spec.write_text("\n".join(lines) + "\n")
          PY
          sed -i '/^android.accept_sdk_license/a p4a.branch = v2024.01.21' buildozer.spec
          sed -i '/^p4a.branch =/a p4a.source_dir = ./python-for-android' buildozer.spec
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake autopoint libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev uuid-dev
      - name: Установка buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
      - name: Подготовка python-for-android для Android
        run: |
          git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git python-for-android
          python - <<'PY'
          from pathlib import Path
          recipe = Path("python-for-android/pythonforandroid/recipes/python3/__init__.py")
          source = recipe.read_text()
          marker = "        'ac_cv_file__dev_ptmx=yes',"
          replacement = "\n".join([
              "        'ac_cv_header_uuid_h=no',",
              "        'ac_cv_header_uuid_uuid_h=no',",
              marker,
          ])
          if marker not in source:
              raise SystemExit("Не найден маркер configure_args python3 recipe")
          recipe.write_text(source.replace(marker, replacement, 1))
          PY
      - name: Сборка debug APK
        run: buildozer -v android debug
      - name: Выложить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: teams-autojoiner-apk
          path: bin/*.apk
