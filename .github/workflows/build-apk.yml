name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Распаковка исходников проекта
        run: |
          unzip -o teams_autojoiner_ready_for_github.zip -d . -x '.github/*'
          sed -i 's/kivy==2.2.1/kivy==2.3.0/' buildozer.spec
          sed -i '/^android.accept_sdk_license/a p4a.branch = v2024.01.21' buildozer.spec
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Установка buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
      - name: Сборка debug APK
        run: buildozer -v android debug
      - name: Выложить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: teams-autojoiner-apk
          path: bin/*.apk
